plugins {
    id 'com.android.application'
}

def configuredApi = providers.gradleProperty("nirikshakApiBase").getOrElse("")
def debugApi = configuredApi ?: "http://10.0.2.2:8000"
if (configuredApi && !(configuredApi ==~ /https?:\/\/[A-Za-z0-9._:\/-]+/)) {
    throw new GradleException("nirikshakApiBase must be an HTTP or HTTPS base URL")
}

android {
    namespace 'in.nirikshak.capture'
    compileSdk 36

    defaultConfig {
        applicationId 'in.nirikshak.capture'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE', "\"${debugApi}\""
        }
        release {
            def secureApi = configuredApi.startsWith("https://") ? configuredApi : ""
            buildConfigField 'String', 'API_BASE', "\"${secureApi}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.12.4'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    implementation 'androidx.lifecycle:lifecycle-livedata-core:2.10.0'
    testImplementation 'junit:junit:4.13.2'
}
